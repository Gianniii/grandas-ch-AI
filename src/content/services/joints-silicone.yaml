fr:
  title: Réfection de joints silicone
  summary: Étanchéité retrouvée dans vos salles d'eau.
  description: >-
    Un joint silicone, à la suite des contraintes qu'il subit (savon, dilatation des matériaux,
    vieillissement, nettoyage, etc.), s'use et finit par sécher et perdre ses propriétés de
    dilatation, fongicides et d'étanchéité. Il faut donc régulièrement vérifier l'état de vos
    silicones, principalement dans les zones d'eau (douches, baignoires, buanderie, bassin, piscine,
    etc.). Nous rénovons vos vieux silicones afin qu'ils retrouvent leurs propriétés et assurent à
    nouveau leur rôle principal d'étanchéité.
  tip: >-
    Conseil : n'utilisez pas les solutions alternatives proposées sur le marché (mastics de mauvaise
    qualité, teintes pour blanchir, etc.) qui ne feront qu'empirer la situation !
en:
  title: Silicone joint renewal
  summary: Restored watertightness in your wet rooms.
  description: >-
    Under the stress it endures (soap, material expansion, ageing, cleaning, etc.), a silicone
    joint wears out, eventually dries and loses its flexibility, fungicidal and waterproofing
    properties. You should therefore regularly check your silicone joints, especially in wet areas
    (showers, bathtubs, laundry rooms, ponds, pools, etc.). We renew your old silicone so that it
    regains its properties and does its main job again: keeping water out.
  tip: >-
    Tip: do not use the alternative products found on the market (low-quality sealants, whitening
    tints, etc.), they will only make things worse!
de:
  title: Erneuerung von Silikonfugen
  summary: Wieder dichte Nasszellen.
  description: >-
    Eine Silikonfuge nutzt sich durch die Belastungen, denen sie ausgesetzt ist (Seife, Ausdehnung
    der Materialien, Alterung, Reinigung usw.), ab, trocknet mit der Zeit aus und verliert ihre
    Dehnungs-, Fungizid- und Dichtungseigenschaften. Prüfen Sie daher regelmässig den Zustand Ihrer
    Silikonfugen, vor allem in Nassbereichen (Duschen, Badewannen, Waschküche, Becken, Pool usw.).
    Wir erneuern Ihre alten Silikonfugen, damit sie ihre Eigenschaften zurückerhalten und wieder
    zuverlässig abdichten.
  tip: >-
    Tipp: Verwenden Sie keine auf dem Markt angebotenen Alternativlösungen (minderwertige
    Dichtmassen, Aufhellungsfarben usw.), sie verschlimmern die Situation nur!
it:
  title: Rifacimento dei giunti in silicone
  summary: Tenuta stagna ritrovata nei vostri bagni.
  description: >-
    Un giunto in silicone, a causa delle sollecitazioni che subisce (sapone, dilatazione dei
    materiali, invecchiamento, pulizia, ecc.), si usura, finisce per seccarsi e perde le sue
    proprietà di dilatazione, fungicide e di tenuta. È quindi necessario verificare regolarmente lo
    stato dei vostri siliconi, soprattutto nelle zone umide (docce, vasche, lavanderia, vasche
    ornamentali, piscine, ecc.). Rinnoviamo i vostri vecchi siliconi affinché ritrovino le loro
    proprietà e svolgano di nuovo il loro ruolo principale di tenuta stagna.
  tip: >-
    Consiglio: non utilizzate le soluzioni alternative proposte sul mercato (mastici di scarsa
    qualità, tinte sbiancanti, ecc.) che non faranno che peggiorare la situazione!
